name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Validate skill package
        run: python scripts/validate_skill.py .
      - name: Compile helpers
        run: python -m py_compile scripts/*.py
      - name: Run tests
        working-directory: scripts
        run: python test_operator.py
