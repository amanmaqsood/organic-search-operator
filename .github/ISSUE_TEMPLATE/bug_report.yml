name: Bug report
description: Report a reproducible problem without private site or account data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private URLs, account identifiers, or customer data.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v1.0.0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe example and exact command.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Agent, operating system, Python version, and relevant provider.
    validations:
      required: true
